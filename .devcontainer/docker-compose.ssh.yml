# sshd overlay — direct SSH into the sandbox container.
#
# Included automatically by .oh/scripts/docker-compose.sh only when access.ssh is
# true in oh.json. Publishing the port is the one decision Docker must make before
# the container exists, so it is all this overlay carries. The host bind stays
# loopback-only (127.0.0.1) so the daemon is reachable from the host and through a
# host-side reverse proxy, but not from the public interface by default — switch
# the bind to 0.0.0.0 for direct remote SSH, or front it with nginx for
# multi-tenant routing. See docs/integrations/sshd.md.
#
# sshd's mode comes from oh.json, not from this file: entrypoint.sh reads
# access.ssh, access.sshPort, access.sshPasswordAuth, and access.sshAuthorizedKeys
# through `oh config show`. Auth is public-key by default; password auth (using
# SANDBOX_PASSWORD) stays off unless access.sshPasswordAuth is true. The entrypoint
# starts sshd as a background daemon alongside `sleep infinity`.

services:
  sandbox:
    ports:
      - "127.0.0.1:${SANDBOX_SSH_PORT:-2222}:22"
