name: ${SANDBOX_NAME:-openharness}

services:
  sandbox:
    image: ${OH_SANDBOX_IMAGE:-sandbox-${SANDBOX_NAME:-openharness}}
    pull_policy: ${OH_PULL_POLICY:-missing}
    container_name: ${SANDBOX_NAME:-openharness}
    build:
      context: ${OH_REPO_DIR:-..}
      dockerfile: .devcontainer/Dockerfile
    volumes:
      - ${OH_HOME_MOUNT:-workspace}:/home/sandbox
      - ${OH_REPO_DIR:-..}:/home/sandbox/harness
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - SANDBOX_NAME=${SANDBOX_NAME:-openharness}
      - SANDBOX_PASSWORD=${SANDBOX_PASSWORD:-test1234}
      - TZ=${TZ:-America/Los_Angeles}
      - CLAUDE_DANGEROUSLY_SKIP_PERMISSIONS=true
      - CC_SAFETY_NET_STRICT=1
      - CC_SAFETY_NET_WORKTREE=1
      - GIT_USER_NAME=${GIT_USER_NAME:-}
      - GIT_USER_EMAIL=${GIT_USER_EMAIL:-}
      - GH_TOKEN=${GH_TOKEN:-}
    stdin_open: true
    tty: true
    cgroup: private
    cap_add:
      - SYS_ADMIN
    tmpfs:
      - /sys/fs
    healthcheck:
      test: ["CMD", "bash", "/home/sandbox/harness/.oh/scripts/sandbox-healthcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 600s
    restart: unless-stopped

volumes:
  workspace:
