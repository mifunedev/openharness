name: "CI: Deployment Guard"

# The published image is the artifact users consume, and it can only be wrong
# after it is published — so this runs on the Release workflow's completion
# rather than on a PR. It is the CI consumer of the same script `/deploy-check`
# runs locally; neither owns any assertion of its own.
on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  workflow_dispatch:
    inputs:
      image:
        description: "Image ref to validate"
        required: false
        default: "ghcr.io/mifunedev/openharness:latest"

concurrency:
  group: deployment-guard-${{ github.event.inputs.image || 'latest' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deployment-guard:
    name: Boot the published image and assert provisioning
    # A release that failed published nothing worth validating. A dispatch has no
    # workflow_run payload, so it always runs.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    # When CI_RUNNER routes this to self-hosted it MUST be the dind model: this
    # job boots a sandbox container and needs an isolated daemon.
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: recursive

      - name: Ensure Mifune submodule
        run: bash .oh/scripts/link-providers.sh --init

      # A silent skip is exactly the failure mode this job exists to close, so
      # every prerequisite fails the job loudly instead of being conditioned away.
      - name: Verify the runner can do this job
        run: |
          command -v docker >/dev/null 2>&1 || { echo "no docker on this runner" >&2; exit 1; }
          command -v jq >/dev/null 2>&1 || { sudo apt-get update && sudo apt-get install -y jq; }
          docker version
          docker compose version
          jq --version

      - name: Run the deployment guard against the published image
        env:
          OH_SANDBOX_IMAGE: ${{ github.event.inputs.image || 'ghcr.io/mifunedev/openharness:latest' }}
          OH_DEPLOY_RUN: oh-depguard-${{ github.run_id }}-${{ github.run_attempt }}
        run: bash .oh/scripts/deployment-guard.sh
