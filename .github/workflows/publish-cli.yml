name: Publish CLI to npm

# Publishes the standalone `oh` CLI (`.oh/cli`) to npm as @mifune/openharness.
#
# The CLI's version is independent of the harness release tags. This
# reusable workflow is called by release.yml after image publication, and can
# also be dispatched for a CLI-only change. Both callers must identify the exact
# commit to publish; the version guard makes an existing version a successful
# no-op.
on:
  workflow_call:
    inputs:
      ref:
        description: Exact commit or ref containing the CLI package to publish
        required: true
        type: string
    secrets:
      NPM_TOKEN:
        required: true
  workflow_dispatch:
    inputs:
      ref:
        description: Exact commit or ref containing the CLI package to publish
        required: true
        type: string

jobs:
  publish-npm:
    name: Publish CLI to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # provenance attestation
    steps:
      - name: Checkout the requested commit
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          submodules: recursive

      - name: Setup Node 22.x
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Skip if version already published
        id: guard
        run: |
          V=$(node -p "require('./.oh/cli/package.json').version")
          if npm view "@mifune/openharness@$V" version >/dev/null 2>&1; then
            echo "@mifune/openharness@$V already published — skipping"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "@mifune/openharness@$V not yet published — will publish"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install CLI dev dependencies
        if: steps.guard.outputs.skip == 'false'
        working-directory: .oh/cli
        run: npm ci --ignore-scripts

      - name: Build CLI bundle
        if: steps.guard.outputs.skip == 'false'
        working-directory: .oh/cli
        run: npm run build

      - name: Publish to npm
        if: steps.guard.outputs.skip == 'false'
        working-directory: .oh/cli
        # `npm publish` packs the working directory and ignores `--prefix` for
        # package selection — running from repo root would pack the private
        # root package (EPRIVATE). Must run inside .oh/cli.
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
