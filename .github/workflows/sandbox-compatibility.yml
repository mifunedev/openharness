name: "CI: Sandbox Compatibility"

# Dockerfile-scoped compatibility CI for the sandbox base (#807): compare the
# exact Node and pnpm versions on fixed Bookworm and Trixie bases, then build one
# amd64 image with every optional INSTALL_* path enabled. The vendor installers
# are expensive and mutable, so the path filter stays narrow. This workflow
# never logs in or pushes.

on:
  workflow_dispatch:
  push:
    branches:
      - development
      - main
    paths:
      - ".devcontainer/Dockerfile"
      - ".devcontainer/entrypoint.sh"
      - ".dockerignore"
      - ".oh/scripts/verify-sandbox-image.sh"
      - ".oh/scripts/node-pnpm-parity.sh"
      - ".oh/scripts/hermes-install-smoke.sh"
      - ".oh/scripts/link-providers.sh"
      - ".oh/cli/src/commands/harness.ts"
      - ".github/workflows/sandbox-compatibility.yml"
  pull_request:
    paths:
      - ".devcontainer/Dockerfile"
      - ".devcontainer/entrypoint.sh"
      - ".dockerignore"
      - ".oh/scripts/verify-sandbox-image.sh"
      - ".oh/scripts/node-pnpm-parity.sh"
      - ".oh/scripts/hermes-install-smoke.sh"
      - ".oh/scripts/link-providers.sh"
      - ".oh/cli/src/commands/harness.ts"
      - ".github/workflows/sandbox-compatibility.yml"

concurrency:
  group: sandbox-compatibility-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  base-node-pnpm-parity:
    name: Verify exact Node and pnpm parity across Debian bases
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Compare fixed Bookworm and Trixie bases
        run: |
          bash .oh/scripts/node-pnpm-parity.sh \
            node:22-bookworm-slim \
            node:22-trixie-slim

  optional-harness-install:
    name: Install every optional harness through the CLI
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: recursive

      - name: Ensure Mifune submodule
        run: bash .oh/scripts/link-providers.sh --init

      # #908 removed the INSTALL_* build args, so there is no longer an image to
      # build with every installer enabled. The path that replaced it —
      # `oh harness install <id>` into the home mount, as the sandbox user — is
      # what this job must exercise instead. Building and then INSTALLING is
      # strictly closer to what an operator does than the old build-arg matrix.
      - name: Build the sandbox image
        run: |
          docker build \
            --file .devcontainer/Dockerfile \
            --tag openharness-sandbox-optional:${{ github.sha }} \
            .

      - name: Verify the image satisfies the default contract
        run: bash .oh/scripts/verify-sandbox-image.sh openharness-sandbox-optional:${{ github.sha }}

      - name: Install each installable harness through the CLI and verify its version
        run: |
          set -euo pipefail
          export SANDBOX_NAME=oh-hermes-optional-${{ github.run_id }}
          export OH_SANDBOX_IMAGE=openharness-sandbox-optional:${{ github.sha }}
          export OH_PULL_POLICY=never
          compose=(docker compose --file .devcontainer/docker-compose.image-only.yml)
          trap '"${compose[@]}" down -v >/dev/null 2>&1 || true' EXIT
          "${compose[@]}" up -d --wait --wait-timeout 600
          cid=$("${compose[@]}" ps -q sandbox)
          docker exec "$cid" bash /home/sandbox/harness/.oh/scripts/sandbox-healthcheck.sh

          ids=$(docker exec -u sandbox "$cid" bash -lc \
            'cd /opt/oh-seed && OH_EXECUTION_TARGET=local oh harness list --json' \
            | jq -r '.[] | select(.kind == "installable") | .id')
          if [ -z "$ids" ]; then
            echo "ERROR: the harness catalog declares no installable harnesses — this job would pass vacuously" >&2
            exit 1
          fi

          # These four installs reach four third-party endpoints. A transient
          # upstream failure must not block this repo's merges: Hermes' own
          # installer hard-fails the whole install when its `npm install` step
          # blips, which took this job down once on a commit that was correct
          # (the rerun passed unchanged). One retry absorbs that. It does NOT
          # weaken the contract below — a genuine break (wrong user, wrong
          # path, a sudo prompt) fails both attempts and still fails the job.
          for id in $ids; do
            for attempt in 1 2; do
              echo "--- oh harness install $id (attempt $attempt)"
              if docker exec -u sandbox "$cid" bash -lc \
                "cd /opt/oh-seed && OH_EXECUTION_TARGET=local oh harness install '$id'"; then
                break
              fi
              if [ "$attempt" = 2 ]; then
                echo "ERROR: $id failed to install twice — this is not a transient upstream blip" >&2
                exit 1
              fi
              echo "$id install failed; retrying once after 15s in case the upstream endpoint blipped" >&2
              sleep 15
            done
          done

          docker exec -u sandbox -w /tmp -e OH_HERMES_SMOKE=1 "$cid" \
            bash /home/sandbox/harness/.oh/scripts/hermes-install-smoke.sh
          docker exec -u sandbox -w /home/sandbox/harness "$cid" oh harness install hermes
          docker exec -u sandbox -w /tmp -e OH_HERMES_SMOKE=1 "$cid" \
            bash /home/sandbox/harness/.oh/scripts/hermes-install-smoke.sh

          "${compose[@]}" restart sandbox
          "${compose[@]}" up -d --wait --wait-timeout 600
          docker exec -u sandbox -w /tmp -e OH_HERMES_SMOKE=1 "$cid" zsh -lic \
            'bash /home/sandbox/harness/.oh/scripts/hermes-install-smoke.sh'

          for id in $ids; do
            binary=$(docker exec -u sandbox "$cid" bash -lc \
              'cd /opt/oh-seed && OH_EXECUTION_TARGET=local oh harness list --json' \
              | jq -r --arg id "$id" '.[] | select(.id == $id) | .binary')
            echo "--- $binary --version"
            output=$(docker exec -u sandbox "$cid" bash -lc "
              path=\$(type -P '$binary')
              case \"\$path\" in
                /home/sandbox/.local/*) ;;
                *) echo \"$id resolved to '\$path', not under /home/sandbox/.local\" >&2; exit 1 ;;
              esac
              \"\$path\" --version" 2>&1)
            printf '%s\n' "$output"
            if ! grep -Eq '(^|[^[:alnum:]])v?[0-9]+([.][0-9]+)+([^[:alnum:]]|$)' <<<"$output"; then
              echo "ERROR: $binary --version did not output a numeric dotted version" >&2
              exit 1
            fi
          done
